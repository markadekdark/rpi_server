name: Generate Apache Style Autoindex

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Autoindex Generator script
        run: |
          python -c "
          import os
          import time

          def generate_html(path):
              items = os.listdir(path)
              # Игнорируем скрытые системные файлы гитхаба
              items = [i for i in items if not i.startswith('.') and i != 'index.html']
              
              html = '<html>\n<head><title>Index of ' + path + '</title></head>\n'
              html += '<body>\n<h1>Index of ' + path + '</h1>\n<hr><pre>\n'
              html += '<a href=\"../\">Parent Directory</a>\n'
              
              for item in items:
                  full_path = os.path.join(path, item)
                  is_dir = os.path.isdir(full_path)
                  name = item + ('/' if is_dir else '')
                  
                  # Получаем системное время изменения файла
                  mtime = os.path.getmtime(full_path)
                  date_str = time.strftime('%Y-%m-%d %H:%M', time.localtime(mtime))
                  
                  # Получаем размер
                  size = '-' if is_dir else str(os.path.getsize(full_path))
                  
                  # Форматируем строку вывода под стандарты Apache
                  html += f'<a href=\"{item}\">{name:<30}</a> {date_str:<20} {size:<10}\n'
                  
              html += '</pre><hr>\n</body>\n</html>'
              
              with open(os.path.join(path, 'index.html'), 'w') as f:
                  f.write(html)
                  
              for item in items:
                  full_path = os.path.join(path, item)
                  if os.path.isdir(full_path):
                      generate_html(full_path)

          generate_html('.')
          "

      - name: Commit and Push generated indexes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@://github.com'
          git add -A
          # Проверяем, есть ли изменения, чтобы не сыпать ошибками
          git diff-index --quiet HEAD || git commit -m '🤖 Auto-generated Apache-style index.html files'
          git push
